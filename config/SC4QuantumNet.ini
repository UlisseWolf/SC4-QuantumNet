; =====================================================================
; SC4 QuantumNet - configuration
; Place this file next to SC4QuantumNet.dll (in the Plugins folder).
; Every key is optional: missing keys use the built-in defaults, which
; are the same values the former PACK_CONSTANTS.lua defined.
; IDs accept hexadecimal (0x...) or decimal values.
; =====================================================================

[General]
; Resource ID registered by sc4-regional-supply-demand for QuantumNet.
; 0x514E4554 is "QNET" in ASCII (placeholder: replace with the real ID).
ResourceID = 0x514E4554
; Unlock/lock the two QuantumNet Data Hub rewards.
EnableRewards = true
; Trade surplus/deficit with the region via sc4-regional-supply-demand.
EnableRegionalTrade = true
; Charge imports / pay exports in Simoleons every month.
EnableTradeFunds = true
; Error | Info | Debug  (written to SC4QuantumNet.log)
LogLevel = Info

[Ratios]
WEALTH_WEIGHT_LOW    = 0.4    ; R$   Sims
WEALTH_WEIGHT_MED    = 1.0    ; R$$  Sims
WEALTH_WEIGHT_HIGH   = 2.2    ; R$$$ Sims
EDUCATION_REFERENCE  = 500    ; average EQ treated as "baseline" (TUNE THIS)
EDUCATION_FACTOR_MIN = 0.5
EDUCATION_FACTOR_MAX = 2.0
BUY_PRICE_PER_UNIT   = 3      ; Simoleons paid per imported QNU
SELL_PRICE_PER_UNIT  = 2      ; Simoleons earned per exported QNU

[Unlocks]
QNET_HUB_SMALL_POP    = 8000
QNET_HUB_SMALL_EDU    = 300
QNET_HUB_LARGE_POP    = 30000
QNET_HUB_LARGE_EDU    = 600
QNET_HUB_LARGE_R3_POP = 2000

[Rewards]
; Building exemplar IDs of the two reward buildings. The exemplars must
; be flagged as conditional (reward) buildings.
HubSmallBuildingID = 0xBB340000
HubLargeBuildingID = 0xBB340001
HubSmallLockedText = QuantumNet Data Hub (Small): requires 8,000 Sims and an average EQ of 300.
HubLargeLockedText = QuantumNet Data Hub (Large): requires 30,000 Sims, an average EQ of 600 and 2,000 R$$$ Sims.

[Producers]
; BuildingID = base QNU/day, monthly cost (Simoleons), name
0xBB340000 = 400,  900,  QuantumNet Data Hub Small
0xBB340001 = 1600, 3600, QuantumNet Data Hub Large

[Consumers]
; BuildingID = QNU/day needed for full efficiency, class, name
0x78A0F71A = 500, Fusion, Fusion Power Plant
; Uncomment and fill in the real IDs once known:
; 0x00000000 = 150, Tidal,     Tidal/Wave Power Plant
; 0x00000000 = 200, Sanitizer, Sewage Sanitizer Plant Small
; 0x00000000 = 800, Sanitizer, Sewage Sanitizer Plant Large
; 0x00000000 = 250, W2E,       Waste-to-Energy Plant Small
; 0x00000000 = 900, W2E,       Waste-to-Energy Plant Large
